    <!-- Redirect old /#/ hash URLs to clean BrowserRouter paths -->
    <script>
      (function() {
        var hash = window.location.hash;
        if (hash && hash.startsWith('#/')) {
          var path = hash.slice(1); // remove the '#', keep the '/...'
          window.history.replaceState(null, '', path + window.location.search);
        }
      })();
    </script>

    <!--
      Critical inline CSS — paints the hero background colour before any JS or
      external stylesheet loads. Eliminates the white-flash during React hydration
      and removes the colour from the Largest Contentful Paint render path.

      Also sets font-display:swap for system fallbacks so text is readable
      immediately, with custom fonts swapped in once downloaded.
    -->
    <style>
      /* Hero background: shown from first byte, zero JS needed */
      :root { color-scheme: light dark; }
      html { background: #0b0f1a; }
      body { margin: 0; background: #0b0f1a; }
      #root { min-height: 100svh; background: #0b0f1a; }
      /* Prevent invisible text during font swap */
      body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }

      /*
       * CLS FIX: Pre-reserve navbar height (76px) before React mounts.
       * This prevents the page content from shifting down when the
       * fixed navbar is painted by React for the first time.
       */
      nav[class*="fixed"] {
        height: 76px;
        contain: layout;
      }

      /*
       * CLS FIX: Reserve logo space (54x54) before the API returns the logo URL.
       * Without this, the logo area collapses to 0 then expands when the image
       * loads from the settings API, causing a large layout shift.
       */
      nav img[fetchpriority="high"] {
        contain: layout;
      }

      /*
       * CLS FIX: Billboard card image containers — lock height before images load
       * so the card grid never reflows as images arrive.
       */
      .cls-card-img {
        height: 220px;
        contain: layout;
        overflow: hidden;
      }
    </style>
